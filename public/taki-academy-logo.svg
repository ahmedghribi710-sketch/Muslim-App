<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Background Circle -->
  <circle cx="200" cy="200" r="195" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Logo Graphics Group -->
  <g id="taki-emblem" transform="translate(100, 50) scale(1.05)">
    <!-- 1. Palestinian Ribbon on Top Left -->
    <g id="palestine-flag">
      <!-- Black stripe -->
      <path d="M 15 36 C 26 28 40 20 54 13 C 60 17 62 23 58 31 C 45 37 32 44 19 48 Z" fill="#000000"/>
      <!-- White stripe -->
      <path d="M 19 48 C 32 44 45 37 58 31 C 55 38 53 45 50 52 C 38 57 26 62 16 64 Z" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="0.75"/>
      <!-- Green stripe -->
      <path d="M 16 64 C 26 62 38 57 50 52 C 48 59 45 66 42 72 C 30 74 19 77 12 79 Z" fill="#008038"/>
      <!-- Red hoist triangle -->
      <path d="M 13 34 L 35 52 L 10 79 C 8 65 8 49 13 34 Z" fill="#EE2A24"/>
    </g>

    <!-- 2. Red bookmark ribbon on Top Right -->
    <g id="red-bookmark">
      <path d="M 142 42 C 152 40 162 47 170 57 C 171 67 167 74 162 77 C 158 68 153 58 142 54 Z" fill="#D32F2F"/>
      <path d="M 144 51 C 153 51 161 60 165 69 C 160 68 153 65 144 60 Z" fill="#B71C1C"/>
    </g>

    <!-- 3. Blue Book / Bubble Base -->
    <path d="M 32 30 H 142 C 148 30 152 34 152 40 V 134 C 152 140 148 144 142 144 H 96 L 80 164 L 78 144 H 32 C 26 144 22 140 22 134 V 40 C 22 34 26 30 32 30 Z" fill="#029BE5"/>
    
    <!-- White vertical book spine edge -->
    <rect x="145" y="38" width="4" height="98" rx="2" fill="#FFFFFF"/>
    <rect x="153" y="44" width="2" height="86" rx="1" fill="#0288D1"/>

    <!-- 4. Arabic letter Qaf (ق) & Open Page Dynamic Tick -->
    <!-- Two dots of Qaf -->
    <rect x="70" y="58" width="7" height="7" rx="1.5" transform="rotate(-20 70 58)" fill="#FFFFFF"/>
    <rect x="80" y="55" width="7" height="7" rx="1.5" transform="rotate(-20 80 55)" fill="#FFFFFF"/>

    <!-- Loop of Qaf -->
    <path d="M 77 71 C 72 71 67 75 67 82 C 67 89 73 93 80 93 C 87 93 91 87 89 80 C 88 74 84 71 77 71 Z M 78 78 C 80 78 82 80 82 82 C 82 85 80 87 78 87 C 75 87 74 85 74 82 C 74 80 75 78 78 78 Z" fill="#FFFFFF"/>

    <!-- Swoosh stroke forming book curve and checkmark -->
    <path d="M 22 104 C 33 107 48 110 65 109 C 76 108 81 100 81 89 L 88 89 C 88 100 91 109 98 117 L 145 62 L 146 72 L 102 127 C 98 131 93 132 88 128 C 83 124 78 117 73 116 C 56 116 38 113 22 110 Z" fill="#FFFFFF"/>
  </g>

  <!-- Typography below emblem -->
  <!-- Taki Academy in modern bold font -->
  <text x="200" y="292" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="36" fill="#029BE5" letter-spacing="-0.5px">
    Taki Academy
  </text>

  <!-- Website URL in cyan -->
  <text x="200" y="325" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="18" fill="#00A0E3">
    www.takiacademy.com
  </text>
</svg>
